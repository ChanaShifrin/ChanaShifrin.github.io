<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chana Shifrin | Data Analytics, Data Science &amp; ML</title>

<style>
:root{
  --pg:#E6EDF4; --ink:#1E3448; --mu:#4A6074; --cm:#1F5F8F;--thumb:#E1EBF3; --ln:#C5D5E3; --bar:#A9BFD2;

  --serif:Georgia,"Times New Roman",serif; --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--pg);color:var(--ink);font:400 15px/1.5 var(--sans)}
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px;width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--cm)}
:focus-visible{outline:3px solid var(--hn);outline-offset:2px;border-radius:3px}

/* top bar: name + contact only */
.top{border-bottom:3px double var(--bar)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-top:11px;padding-bottom:10px}
.nm{font:700 18px var(--serif);color:var(--ink);text-decoration:none;letter-spacing:.01em}
.ct{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;font:500 13px var(--sans)}
.ct a{color:var(--ink);text-decoration:none;border-bottom:1px solid transparent}
.ct a:hover{border-bottom-color:var(--cm);color:var(--cm)}
.ct .soon{color:var(--mu)}

/* tabs (in-page) */
.tabs{display:flex;gap:2px;flex-wrap:wrap;padding-top:6px}
.tab{font:600 14px var(--sans);color:var(--mu);background:none;border:0;border-bottom:3px solid transparent;padding:7px 12px 8px;cursor:pointer;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--cm);border-bottom-color:var(--cm)}
.tabline{border-bottom:1px solid var(--ln)}

main{flex:1}
#panel{padding-top:28px;padding-bottom:14px}
#panel.isall{padding-top:18px}
#panel.isrole{padding-top:22px}
#panel.isall .tg,#panel.isall .ld{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0;min-height:0}
.tg{font:600 clamp(20px,2.6vw,27px)/1.15 var(--serif);margin:0 0 0;min-height:2.3em}
@media (min-width:760px){.tg{min-height:1.15em}}
.cur{display:inline-block;width:2px;height:.95em;background:var(--cm);margin-left:2px;vertical-align:-.12em;animation:blink 1.05s steps(1) infinite}
.static .cur{animation:none;opacity:0}
@keyframes blink{50%{opacity:0}}
.ld{margin:0 0 9px;line-height:1.45;color:var(--mu);font-size:13.5px;max-width:none}

/* controls */
.ctl{display:flex;flex-wrap:nowrap;gap:6px 14px;align-items:flex-start;margin-bottom:4px}.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 0;min-width:0}
.chip{font:500 12.5px var(--sans);color:var(--ink);background:var(--card);border:1px dashed var(--dash);border-radius:5px;padding:2px 10px;cursor:pointer}
.chip:hover{border-color:var(--cm)}
.chip[aria-pressed="true"]{background:var(--cm);color:var(--card);border:1px solid var(--cm)}
.find{flex:0 0 200px;font:400 13px var(--sans);color:var(--ink);background:var(--card);border:1px solid var(--bar);border-radius:4px;padding:4px 10px;}
.find::placeholder{color:var(--mu);opacity:1}
.linkbtn{background:none;border:0;padding:0;color:var(--cm);font:600 12.5px var(--sans);text-decoration:underline;cursor:pointer}

/* sections */
.sec{display:flex;align-items:center;gap:8px;margin:8px 0 7px;font:700 12px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--mu)}
.sec .ln{flex:1;border-top:1px solid var(--ln)}
.inf{font:500 12.5px var(--sans);letter-spacing:0;text-transform:none;color:var(--mu);white-space:nowrap}
.linkbtn{background:none;border:0;padding:0;margin-left:8px;color:var(--cm);font:600 12.5px var(--sans);text-decoration:underline;cursor:pointer}
.pins{display:flex;flex-direction:column;gap:11px;padding:0 6px 6px}
.rect,.row{display:grid;align-items:center;background:var(--card);border:1.5px solid var(--bar);border-radius:5px;
  box-shadow:0 0 0 3px var(--card),0 0 0 4.5px var(--halo),0 9px 14px -9px rgba(30,60,90,.30)}
.rect{grid-template-columns:76px minmax(0,1fr) auto;gap:14px;padding:7px 14px 8px;border-top:3px solid var(--cm)}
.row{grid-template-columns:64px minmax(0,1fr) auto;gap:14px;margin:0 6px 10px;padding:6px 13px}
svg.th{display:block;width:100%;height:34px;border-radius:3px;background:var(--thumb)}
.row svg.th{height:28px}
.t1{display:flex;align-items:center;gap:8px;min-width:0}
.t1 h3{font:700 14.5px/1.25 var(--serif);margin:0;color:var(--ink)}
.pill{font:700 10px var(--sans);letter-spacing:.1em;color:var(--card);background:var(--cm);padding:1px 8px;border-radius:3px;text-transform:uppercase;white-space:nowrap}
.smp{font:600 10px var(--sans);letter-spacing:.06em;color:var(--mu);border:1px solid var(--bar);border-radius:3px;padding:0 5px;text-transform:uppercase;white-space:nowrap}
.bl{margin:2px 0 0;font-size:13px;color:var(--mu);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0;list-style:none}
.row .tags{margin-top:3px}
.tags li{font:500 11.5px var(--sans);padding:0 8px;border:1px dashed var(--dash);border-radius:4px;background:var(--card);color:var(--ink)}
.tags li.on{background:var(--cm);color:var(--card);border:1px solid var(--cm)}
.lks{display:flex;gap:14px;font:600 12.5px var(--sans)}
.lks span{color:var(--mu)}
.lks a{color:var(--cm)}
.rr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.empty{background:var(--card);border:1px dashed var(--dash);border-radius:6px;padding:18px 16px;margin:10px 6px;text-align:center;color:var(--ink)}
.empty p{margin:0 0 8px}
.btn{font:600 13px var(--sans);color:var(--card);background:var(--cm);border:1px solid var(--cm);border-radius:5px;padding:5px 14px;cursor:pointer;margin:0 3px}
.btn.alt{color:var(--cm);background:var(--card)}
.foot{padding:6px 8px 4px;font:400 12.5px var(--sans);color:var(--mu)}
.scwrap{position:relative}
.hint{display:none}
.ax{stroke:var(--ln);fill:none}.lb{fill:var(--bar)}.hb{fill:var(--cm)}.l2{fill:none;stroke:var(--cm)}.dt{fill:var(--hn)}.fl{fill:var(--card);stroke:var(--bar)}.ds{fill:none;stroke:var(--cm);stroke-dasharray:4 3}

/* approach rectangles (role tabs) */
.rc{margin:0 6px 10px;padding:6px 15px 7px;background:var(--card);border:1.5px solid var(--bar);border-top:3px solid var(--cm);border-radius:5px;box-shadow:0 0 0 3px var(--card),0 0 0 4.5px var(--halo),0 9px 14px -9px rgba(30,60,90,.30)}
.rc .rtop{display:flex;align-items:center;gap:10px;margin-bottom:4px;min-width:0}
.rc .ttl{font:700 15px/1.25 var(--serif);margin:0;color:var(--ink)}
.rc .lks{margin-left:auto}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cols>div{border-left:2px solid #D5E1EC;padding-left:10px}
.lb{font:700 10.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--cm);margin-bottom:1px}
.tx{margin:0;font:400 12.5px/1.35 var(--sans);color:var(--ink)}
.rc .tags{margin-top:5px}
.seeall{font:600 13px var(--sans);letter-spacing:0;text-transform:none;color:var(--cm);text-decoration:none;white-space:nowrap}
.seeall:hover{text-decoration:underline}
#panel.isrole .ctl{display:none}
@media (min-width:861px) and (min-height:521px){#panel.isrole .scroll{padding-bottom:6px}}
/* one-screen layout: the page never scrolls; the project list rolls up inside it */
@media (min-width:861px) and (min-height:521px){
  html,body{height:100%;overflow:hidden}
  .page{height:100vh;height:100dvh;min-height:0}
  main#panel{flex:1;min-height:0;display:flex;flex-direction:column}
  .scwrap{flex:1;min-height:0}
  .scroll{height:100%;overflow-y:auto;padding:4px 0 22px;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--ft,0px),#000 calc(100% - var(--fb,0px)),transparent 100%);
    mask-image:linear-gradient(to bottom,transparent 0,#000 var(--ft,0px),#000 calc(100% - var(--fb,0px)),transparent 100%)}
  .scroll::-webkit-scrollbar{display:none}
  .scroll:focus-visible{outline-offset:-3px}
  .hint{display:flex;justify-content:center;position:absolute;left:0;right:0;bottom:6px;pointer-events:none;opacity:0;transition:opacity .35s}
  .hint.show{opacity:1}
  .hint span{font:600 12px var(--sans);color:var(--mu);background:rgba(230,237,244,.92);border:1px solid var(--ln);border-radius:999px;padding:2px 12px}
}
@media (max-width:860px){
  .cols{grid-template-columns:1fr;gap:8px}
  .rc .rtop{flex-wrap:wrap}.rc .lks{margin-left:0}
  .rect,.row{grid-template-columns:54px minmax(0,1fr)}
  .rect .rr,.row .lks{grid-column:2;align-items:flex-start}
  .bl{white-space:normal}
  .t1{flex-wrap:wrap}
  .ctl{flex-wrap:wrap}.chips{flex:1 1 100%}.find{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){.cur{animation:none}.hint{transition:none}}
</style>
</head>

function rect(p,n){return '<article class="rect">'+thumb(p.chart)+'<div style="min-width:0"><div class="t1"><span class="pill">No. '+('0'+n).slice(-2)+'</span><h3>'+esc(p.title)+'</h3>'+(p.sample?'<span class="smp">Sample</span>':'')+'</div><p class="bl">'+esc(p.blurb)+'</p></div><div class="rr">'+tagsHtml(p)+links(p)+'</div></article>';}
function rc(p,n){return '<article class="rc"><div class="rtop"><span class="pill">No. '+('0'+n).slice(-2)+'</span><h3 class="ttl">'+esc(p.title)+'</h3>'+(p.sample?'<span class="smp">Sample</span>':'')+links(p).replace('class="lks"','class="lks"')+'</div><div class="cols"><div><div class="lb">Problem</div><p class="tx">'+esc(p.prob)+'</p></div><div><div class="lb">What I did</div><p class="tx">'+esc(p.did)+'</p></div><div><div class="lb">'+esc(p.lbl||'Impact')+'</div><p class="tx">'+esc(p.imp)+'</p></div></div>'+tagsHtml(p)+'</article>';}
function row(p){return '<article class="row">'+thumb(p.chart)+'<div style="min-width:0"><div class="t1"><h3>'+esc(p.title)+'</h3>'+(p.sample?'<span class="smp">Sample</span>':'')+'</div>'+tagsHtml(p)+'</div>'+links(p)+'</article>';}
function secHtml(label,info){return '<div class="sec"><span>'+label+'</span><span class="ln"></span>'+(info||'')+'</div>';}
function renderResults(){
  var foot='<div class="foot">&copy; 2026 Chana Shifrin. Projects marked Sample are placeholders until the real ones are published.</div>';
  if(tab!=='all'){
    var pl=P.filter(function(p){return p.roles.indexOf(tab)>-1&&p.pin&&p.pin[tab];}).sort(function(a,b){return a.pin[tab]-b.pin[tab];});
    $('pins').innerHTML='';
    $('morehead').innerHTML='<div class="sec"><span>Top Projects</span><span class="ln"></span><a class="seeall" href="#all">See all projects &rarr;</a></div>';
    $('scroll').innerHTML=pl.map(function(p){return rc(p,p.pin[tab]);}).join('');
    $('scroll').scrollTop=0;fades();return;
  }
  var f=S[tab],active=f.skills.length||f.q,list=P.filter(matches),n=list.length;
  var info=active&&n?'<span class="inf" aria-live="polite">'+n+' project'+(n===1?'':'s')+' match<button class="linkbtn" type="button" data-act="clear">Clear filters</button></span>':'';
  $('pins').innerHTML='';
  $('morehead').innerHTML=n?secHtml('All projects ('+n+')',info):'';
  var h=list.map(row).join('');
  if(!n){h='<div class="empty"><p><strong>No projects match.</strong></p><button class="btn alt" type="button" data-act="clear">Clear filters</button></div>';}
  $('scroll').innerHTML=h+foot;
  $('scroll').scrollTop=0;fades();
}
function fades(){
  var s=$('scroll'),max=s.scrollHeight-s.clientHeight;
  s.style.setProperty('--ft',Math.min(30,s.scrollTop)+'px');
  s.style.setProperty('--fb',Math.max(0,Math.min(26,max-s.scrollTop))+'px');
  $('hint').classList.toggle('show',max>8&&s.scrollTop<12);
}
$('scroll').addEventListener('scroll',fades,{passive:true});
window.addEventListener('resize',fades);
/* the page itself never scrolls: wheel / keys anywhere roll the project list */
document.addEventListener('wheel',function(e){var s=$('scroll');if(s.contains(e.target)||e.ctrlKey)return;if(s.scrollHeight>s.clientHeight)s.scrollTop+=e.deltaY;},{passive:true});
document.addEventListener('keydown',function(e){
  if(document.activeElement!==document.body)return;
  var s=$('scroll'),k=e.key,d=0;
  if(k==='ArrowDown')d=60;else if(k==='ArrowUp')d=-60;else if(k==='PageDown'||k===' ')d=s.clientHeight*.85;else if(k==='PageUp')d=-s.clientHeight*.85;
  else if(k==='End'){s.scrollTop=s.scrollHeight;e.preventDefault();return;}else if(k==='Home'){s.scrollTop=0;e.preventDefault();return;}
  if(d){e.preventDefault();s.scrollBy({top:d,behavior:'smooth'});}
});
function renderChips(){
  var f=S[tab];
  $('chips').innerHTML=ROLES[tab].skills.map(function(s){return '<button class="chip" type="button" aria-pressed="'+(f.skills.indexOf(s)>-1)+'" data-skill="'+esc(s)+'">'+esc(s)+'</button>';}).join('');
  $('find').value=f.q;
}

/* ---------------- tagline typing ---------------- */
var motion=true, reduce=false, token=0;
try{reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
if(reduce)motion=false;
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function rnd(a,b){return a+Math.random()*(b-a);}
var NEAR={a:'sqs',b:'vgn',c:'xdv',d:'sfe',e:'wrd',f:'dgr',g:'fht',h:'gjy',i:'uok',j:'hku',k:'jli',l:'kop',m:'nk',n:'bmh',o:'ipl',p:'ol',r:'etf',s:'adw',t:'ryg',u:'yij',v:'cfb',w:'qes',y:'tuh'};
function wrong(ch){var l=ch.toLowerCase(),n=NEAR[l];if(!n)return null;var w=n[Math.floor(Math.random()*n.length)];return ch===l?w:w.toUpperCase();}
async function typeText(el,base,text,tk){
  var i,ch,d,w;
  for(i=0;i<text.length;i++){
    if(tk!==token)return false;
    ch=text[i];d=rnd(80,160);
    if(' ,.'.indexOf(ch)>-1)d+=rnd(60,200);
    if(Math.random()<.07)d+=rnd(350,800);
    if(i>2&&Math.random()<.035&&(w=wrong(ch))){
      el.textContent=base+text.slice(0,i)+w;await sleep(rnd(140,260));
      if(tk!==token)return false;
      await sleep(rnd(200,450));
      el.textContent=base+text.slice(0,i);await sleep(rnd(90,180));
    }
    el.textContent=base+text.slice(0,i+1);
    await sleep(d);
  }
  return tk===token;
}
async function eraseText(el,base,text,tk){
  for(var n=text.length;n>0;n--){if(tk!==token)return false;el.textContent=base+text.slice(0,n-1);await sleep(rnd(40,95));}
  return tk===token;
}
async function runTagline(){
  var tk=++token,R=ROLES[tab],vis=$('tgvis'),full=$('tgfull'),h1=$('tg');
  if(tab==='all'){full.textContent=R.heading;vis.textContent=R.heading;h1.classList.add('static');return;}
  h1.classList.remove('static');
  full.textContent=R.prefix+R.endings[0];
  if(!motion){vis.textContent=R.prefix+R.endings[0];h1.classList.add('static');return;}
  vis.textContent='';
  if(!(await typeText(vis,'',R.prefix,tk)))return;
  var i=0,e;
  while(tk===token){
    e=R.endings[i%R.endings.length];
    await sleep(rnd(500,900));
    if(!(await typeText(vis,R.prefix,e,tk)))return;
    await sleep(rnd(2200,3800));
    if(!(await eraseText(vis,R.prefix,e,tk)))return;
    await sleep(rnd(700,1500));
    i++;
  }
}

/* ---------------- routing / tabs ---------------- */
function setTab(t,focus){
  if(!TABS[t])t='analytics';
  tab=t;
  ['analytics','ml','all'].forEach(function(k){var b=$('t-'+k),on=k===t;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;});
  $('panel').setAttribute('aria-labelledby','t-'+t);
  $('ld').textContent=ROLES[t].lede;$('panel').classList.toggle('isall',t==='all');$('panel').classList.toggle('isrole',t!=='all');
  document.title='Chana Shifrin | '+TABS[t].label;
  renderChips();renderResults();runTagline();
  if(focus)$('t-'+t).focus();
}
function route(){var h=(location.hash||'').replace('#','');setTab(TABS[h]?h:'analytics');}
window.addEventListener('hashchange',route);
$('tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(!b)return;var t=b.getAttribute('data-tab');if(location.hash==='#'+t)setTab(t);else location.hash=t;});
$('tabs').addEventListener('keydown',function(e){
  var order=['analytics','ml','all'],i=order.indexOf(tab),n=null;
  if(e.key==='ArrowRight')n=order[(i+1)%3];else if(e.key==='ArrowLeft')n=order[(i+2)%3];else if(e.key==='Home')n=order[0];else if(e.key==='End')n=order[2];
  if(n){e.preventDefault();location.hash=n;setTimeout(function(){$('t-'+n).focus();},0);}
});
$('chips').addEventListener('click',function(e){
  var b=e.target.closest('.chip');if(!b)return;
  var s=b.getAttribute('data-skill'),a=S[tab].skills,i=a.indexOf(s);
  if(i>-1)a.splice(i,1);else a.push(s);
  b.setAttribute('aria-pressed',i<0);renderResults();
});
$('find').addEventListener('input',function(){S[tab].q=this.value.trim();renderResults();});
function clearAll(){S[tab].skills=[];S[tab].q='';renderChips();renderResults();}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act');
  if(a==='clear')clearAll();
  if(a==='searchall'){S.all.skills=S[tab].skills.filter(function(s){return ROLES.all.skills.indexOf(s)>-1;});S.all.q=S[tab].q;location.hash='all';}
});

/* ---------------- background: FT-5B (ripple nodes, fly-through, ~1/3 strength) ---------------- */
var cv=$('net'),ctx=cv.getContext('2d'),W=0,H=0,B='47,95,140',HN='60,141,196',SP=110,SPEED=24,F=300,STRENGTH=.34;
function R(s){var x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function sm(a,b,p){var u=Math.min(1,Math.max(0,(p-a)/(b-a)));return u*u*(3-2*u);}
var LC={};
function layer(k){var key='l'+k;if(LC[key])return LC[key];var n=5+Math.floor(R(k*3.1)*3),ns=[],i;
  for(i=0;i<n;i++)ns.push({x:(R(k*17+i)-.5)*620,y:(R(k*29+i+4)-.5)*320});return LC[key]=ns;}
function edges(k){var key='e'+k;if(LC[key])return LC[key];var A=layer(k),Bn=layer(k+1),E=[];
  A.forEach(function(a,i){var d=Bn.map(function(b,j){return [Math.hypot(a.x-b.x,a.y-b.y),j];}).sort(function(p,q){return p[0]-q[0];});
    for(var m=0;m<2+(R(k*5+i)>.55?1:0);m++)E.push({i:i,j:d[m][1],w:R(k*50+i*7+m)});});return LC[key]=E;}
function draw(t){
  var x=ctx;x.globalAlpha=1;x.clearRect(0,0,W,H);x.globalAlpha=STRENGTH;
  var z=t*SPEED,cx=W*.6,cy=H*.5,sc=Math.min(2.6,Math.max(.9,W/520)),scr=Math.min(1.3,Math.max(.8,W/520)),
      camX=28*Math.sin(t*.07),camY=14*Math.sin(t*.05+1),k0=Math.floor(z/SP)+1,k1=k0+9,k,e,EN={};
  if(Object.keys(LC).length>400)LC={};
  function P(k,n){var d=k*SP-z,f=F/d;return {x:cx+(n.x-camX)*f*sc,y:cy+(n.y-camY)*f*sc,f:f,d:d};}
  function vis(d){return (1-sm(720,960,d))*sm(110,340,d);}
  x.lineCap='round';x.lineJoin='round';
  for(k=k1-1;k>=k0;k--){
    var A=layer(k),Bn=layer(k+1),E=edges(k);
    for(e=0;e<E.length;e++){
      var q=E[e],a=P(k,A[q.i]),b=P(k+1,Bn[q.j]);if(a.d<110)continue;
      var tb=(k*SP-830)/SPEED+q.w*1.6,p=sm(0,1,(t-tb)/2.6);if(p<=0)continue;
      var v=(vis(a.d)+vis(b.d))/2,dev=1-sm(250,650,a.d),stg=(q.w<.3?(1-dev*.9):.45+.55*q.w*dev),al=v*stg*.4;if(al<.012)continue;
      var mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,
          cvv=((q.w*7.3%1)-.5)*.9+.25*Math.sin(t*.25+q.w*9),qx=mx-dy/L*L*.28*cvv,qy=my+dx/L*L*.28*cvv;
      var pt=function(u){var m=1-u;return [m*m*a.x+2*m*u*qx+u*u*b.x,m*m*a.y+2*m*u*qy+u*u*b.y];};
      x.strokeStyle='rgba('+B+','+al+')';x.lineWidth=Math.min(1.6,Math.max(.6,(.6+.9*q.w*dev)*(a.f+b.f)*scr));
      x.beginPath();var N=16,s,pp;for(s=0;s<=N;s++){pp=pt(s/N*p);if(s)x.lineTo(pp[0],pp[1]);else x.moveTo(pp[0],pp[1]);}x.stroke();
      if(p<1){pp=pt(p);x.fillStyle='rgba('+HN+','+(al*2)+')';x.beginPath();x.arc(pp[0],pp[1],Math.min(3,1.4+(a.f+b.f)*scr),0,7);x.fill();}
      else if(q.w>.55&&dev>.25){
        var ph=t*.26+q.w*9+q.i*.17,u=ph%1,age=(ph-Math.floor(ph))/.26,kk=(k+1)+'_'+q.j;
        if(age<1.7&&(EN[kk]===undefined||EN[kk]>age))EN[kk]=age;
        pp=pt(u);x.fillStyle='rgba('+HN+','+(al*1.8*Math.sin(u*3.14))+')';x.beginPath();x.arc(pp[0],pp[1],Math.min(3.2,1.3+(a.f+b.f)*scr),0,7);x.fill();
      }
    }
  }
  for(k=k1;k>=k0;k--){
    layer(k).forEach(function(n,ii){
      var p=P(k,n),v=vis(p.d);if(v<=.01)return;
      var bs=.45+1.7*R(k*13+ii*5+2),r=Math.min(9,Math.max(1.5,bs*p.f*scr*4))*(.5+.5*sm(960,720,p.d)),
          ag=EN[k+'_'+ii],sa=ag===undefined?1:ag/1.7,en=ag===undefined?0:Math.exp(-ag*2.6);
      if(ag!==undefined){x.strokeStyle='rgba('+HN+','+(v*.6*(1-sa))+')';x.lineWidth=1.3;x.beginPath();x.arc(p.x,p.y,r*(1.2+2.8*sa),0,7);x.stroke();}
      x.fillStyle='rgba('+HN+','+(v*(.5+.4*en))+')';x.strokeStyle='rgba('+B+','+(v*.55)+')';x.lineWidth=1.1;
      x.beginPath();x.arc(p.x,p.y,r,0,7);x.fill();x.stroke();
    });
  }
  x.globalAlpha=1;
}
function size(){var dp=Math.min(window.devicePixelRatio||1,1.75);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*dp);cv.height=Math.round(H*dp);ctx.setTransform(dp,0,0,dp,0,0);if(!running)draw(STILL_T);}
var running=false,raf=0,last=0,clock=40,STILL_T=60;
function frame(now){
  raf=requestAnimationFrame(frame);
  if(now-last<33)return;
  var dt=Math.min((now-last)/1000,.1);last=now;clock+=dt;draw(clock);
}
function netState(){
  if(motion&&!document.hidden){if(!running){running=true;last=performance.now();raf=requestAnimationFrame(frame);}}
  else{if(running){running=false;cancelAnimationFrame(raf);}draw(STILL_T);}
}
document.addEventListener('visibilitychange',netState);
var rt=0;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(size,120);});

/* ---------------- go ---------------- */
size();netState();route();
})();
</script>
