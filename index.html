<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chana Shifrin | Data Analytics and Data Science</title>
<meta name="description" content="Portfolio of Chana Shifrin: data analytics projects (SQL, dashboards, experiments) and data science and machine learning projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6F8; --surface:#FFFFFF; --ink:#12202B; --muted:#52636F; --line:#D5DEE4;
  --accent:#0B6E8E; --hi:#E08A00; --bar:#B9CCD6; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E1A22; --surface:#15252F; --ink:#E8EFF3; --muted:#9BB0BC; --line:#2A3E4A;
        --accent:#4FB8D9; --hi:#F2A93B; --bar:#33505F; color-scheme:dark;}
}
*{box-sizing:border-box}
html{scroll-padding-top:64px}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font:400 16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent);text-underline-offset:3px;font-weight:600}
a:focus-visible,button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--hi);outline-offset:3px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px;width:100%}

header{padding:16px 0;border-bottom:1px solid var(--line)}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap}
.name{font-weight:700;font-size:18px;letter-spacing:-.01em}
.contact{display:flex;gap:20px;flex-wrap:wrap}
.soon{color:var(--muted);font-size:inherit;font-weight:600;cursor:default}

.tabbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
[role=tablist]{display:flex;gap:4px;overflow-x:auto}
[role=tab]{background:none;border:0;border-bottom:3px solid transparent;padding:14px 14px 11px;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap}
[role=tab]:hover{color:var(--ink)}
[role=tab][aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.count{font-weight:500;font-size:12px;margin-left:6px;padding:1px 7px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted)}

main{flex:1;padding:28px 0 36px}
[role=tabpanel][hidden]{display:none}
.intro{margin-bottom:18px}
h1{font-size:clamp(26px,3.6vw,38px);line-height:1.12;letter-spacing:-.025em;margin:0 0 8px;font-weight:700}
.lede{color:var(--muted);margin:0 0 14px;max-width:62ch}
.skills,.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.tags{gap:6px;margin:0 0 12px}
.sk{font-size:13px;font-weight:500;padding:2px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink)}
.sk:hover{border-color:var(--accent);color:var(--accent)}
.sk[aria-pressed=true],.sk.x{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.sk.x:hover{color:var(--surface);opacity:.85}
.skills-hint{font-size:13px;color:var(--muted);margin:8px 0 0}

.controls{margin-bottom:6px}
.search{width:100%;max-width:520px;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search::placeholder{color:var(--muted)}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:12px 0 0;color:var(--muted);font-size:14px;min-height:28px}
.actives{display:flex;flex-wrap:wrap;gap:6px}
.clear{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.empty{margin-top:18px;padding:28px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.empty .clear{display:block;margin:10px auto 0}

.sec{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;transition:border-color .2s}
.card:hover,.card:focus-within,.row:hover,.row:focus-within{border-color:var(--accent)}
svg{display:block;width:100%;height:auto}
.card svg{margin-bottom:12px}
.badges{display:flex;gap:6px;margin:0 0 8px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;padding:1px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.badge.sample{border-color:var(--hi);color:var(--hi)}
.axis{stroke:var(--line);stroke-width:1}
.t{fill:var(--muted);font:11px "IBM Plex Sans",sans-serif}
.b{fill:var(--bar)} .b.h{fill:var(--accent)}
.ln{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.dash{fill:none;stroke:var(--bar);stroke-width:2;stroke-dasharray:5 5}
.dot{fill:var(--hi)} .ci{stroke:var(--ink);stroke-width:2}
.arr{stroke:var(--muted);stroke-width:2;fill:none;stroke-linecap:round}
h3{font-size:17px;line-height:1.3;letter-spacing:-.01em;margin:0 0 8px}
.card p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.more-in{overflow:hidden;min-height:0}
.card:hover .more,.card:focus-within .more,.row:hover .more,.row:focus-within .more{grid-template-rows:1fr}
.more p{font-size:14px;margin:0 0 8px;color:var(--muted)}
.more strong{color:var(--ink);font-weight:600}
.links{display:flex;gap:16px;margin-top:auto;font-size:14.5px;flex-wrap:wrap}
.links .soon{font-size:14px;font-weight:500}
.hint{margin:14px 0 0;color:var(--muted);font-size:13px}

.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:16px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;transition:border-color .2s}
.rthumb{width:96px}
.rbody h3{font-size:16px;margin:0 0 4px}
.rblurb{margin:0 0 8px;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tags{margin:0 0 4px}
.row .links{flex-direction:column;gap:4px;align-items:flex-end;margin:0;white-space:nowrap}

footer{padding:14px 0 20px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
@media (max-width:900px){
  .grid{grid-template-columns:1fr}
  .card .more{grid-template-rows:1fr}.hint{display:none}
}
@media (max-width:700px){
  .row{grid-template-columns:72px minmax(0,1fr)}
  .rthumb{width:72px}
  .rblurb{white-space:normal}
  .row .links{grid-column:1/-1;flex-direction:row;align-items:flex-start}
}
@media (hover:none){.card .more{grid-template-rows:1fr}.hint{display:none}}
@media (prefers-reduced-motion:reduce){.more,.card,.row{transition:none}}
</style>
</head>

  <div class="wrap">
    <span class="name">Chana Shifrin</span>

      <a href="mailto:cshifrin16@gmail.com">cshifrin16@gmail.com</a>

<div class="tabbar">
  <div class="wrap">
    <div role="tablist" aria-label="Portfolio sections" id="tablist"></div>

</div>

<main>
  <div class="wrap" id="panels">
    <noscript><p>This portfolio needs JavaScript to show its projects. My work is also on <a href="https://github.com/ChanaShifrin">GitHub</a>.</p></noscript>
  </div>
</main>

<footer>
  <div class="wrap"><span id="foot">&copy; 2026 Chana Shifrin</span></div>

<script>
/* ------------------------------------------------------------------
   EDIT HERE. Each project is one entry. Add a project once and it
   shows up in its tab(s) and in All Projects, with filters working.
   - roles: "analytics", "ml", or both
   - pin: tabs where this project is a Top Project (first 3 per tab
     are shown as cards; the rest appear under More Projects)
   - sample: true shows a "Sample" badge. Delete the line when real.
   - links: [label, url]. Use null for url until it exists; it shows
     as "(soon)" instead of a dead link.
   ------------------------------------------------------------------ */
const TABS = [
  {id:"analytics", label:"Data Analytics"},
  {id:"ml",        label:"Data Science & ML"},
  {id:"all",       label:"All Projects"}
];

const ROLES = {
  analytics: {
    h1: "I find the story in the data and tell it to the people who decide.",
    lede: "Data analyst focused on SQL, dashboards, and experiment analysis. Each project starts with a business question and ends with a recommendation.",
    skills: ["SQL","Python (pandas)","Tableau","Power BI","Excel","A/B testing"]
  },
  ml: {
    h1: "I build models that hold up outside the notebook.",
    lede: "Machine learning and data science focused on clean features, honest evaluation, and models people can actually use. Each project starts with a prediction problem and ends with a measured result.",
    skills: ["Python","scikit-learn","Feature engineering","Model evaluation","FastAPI","Docker"]
  }
};
const ALL_LEDE = "Every project in one list. Search by keyword, or select skills to narrow it down. Selecting several skills shows only projects that use all of them.";

const THUMBS = {
  delivery: '<svg viewBox="0 0 300 110" role="img" aria-label="Review score drops as delivery delay grows"><line class="axis" x1="10" y1="92" x2="290" y2="92"/><rect class="b" x="30" y="14" width="42" height="78" rx="3"/><rect class="b" x="100" y="26" width="42" height="66" rx="3"/><rect class="b" x="170" y="48" width="42" height="44" rx="3"/><rect class="b h" x="240" y="64" width="42" height="28" rx="3"/><text class="t" x="51" y="106" text-anchor="middle">On time</text><text class="t" x="261" y="106" text-anchor="middle">7+ days</text></svg>',
  sales: '<svg viewBox="0 0 300 110" role="img" aria-label="Monthly sales rising with a dip in August"><line class="axis" x1="10" y1="92" x2="290" y2="92"/><polyline class="ln" points="25,70 55,64 85,58 115,52 145,48 175,72 205,40 235,32 265,24"/><circle class="dot" cx="175" cy="72" r="5"/><text class="t" x="25" y="106">Jan</text><text class="t" x="250" y="106">Oct</text><text class="t" x="188" y="76">Aug dip</text></svg>',
  abtest: '<svg viewBox="0 0 300 110" role="img" aria-label="A/B test: variant 6.1 percent conversion versus control 5.2 percent"><line class="axis" x1="10" y1="92" x2="290" y2="92"/><rect class="b" x="70" y="44" width="64" height="48" rx="3"/><rect class="b h" x="170" y="30" width="64" height="62" rx="3"/><line class="ci" x1="102" y1="36" x2="102" y2="52"/><line class="ci" x1="202" y1="22" x2="202" y2="40"/><text class="t" x="102" y="106" text-anchor="middle">Control 5.2%</text><text class="t" x="202" y="106" text-anchor="middle">Variant 6.1%</text></svg>',
  curve: '<svg viewBox="0 0 300 110" role="img" aria-label="Model curve rising well above a random baseline"><line class="axis" x1="10" y1="92" x2="290" y2="92"/><line class="dash" x1="25" y1="92" x2="270" y2="20"/><path class="ln" d="M25 92 C 35 40, 70 24, 270 18"/><text class="t" x="150" y="106" text-anchor="middle">Model vs. baseline</text></svg>',
  api: '<svg viewBox="0 0 300 110" role="img" aria-label="Pipeline from trained model to API to container"><rect class="b" x="14" y="30" width="72" height="40" rx="6"/><rect class="b" x="114" y="30" width="72" height="40" rx="6"/><rect class="b h" x="214" y="30" width="72" height="40" rx="6"/><path class="arr" d="M88 50 H112 M188 50 H212"/><text class="t" x="50" y="54" text-anchor="middle">Model</text><text class="t" x="150" y="54" text-anchor="middle">API</text><text class="t" x="250" y="54" text-anchor="middle">Docker</text></svg>'
};

const P = [
  { id:"delivery", roles:["analytics"], pin:["analytics"], sample:true, thumb:"delivery",
    title:"Late deliveries are quietly costing the marketplace its repeat customers",
    blurb:"Analyzed 100K orders across 9 tables. Customers whose first order arrived over a week late rarely ordered again.",
    skills:["SQL","PostgreSQL","Cohort analysis"],
    q:"Do late deliveries hurt repeat purchases?",
    a:"Joined 9 tables, built signup cohorts, and compared retention by delay bucket with window functions.",
    r:"Orders 7+ days late averaged 2.1 stars vs. 4.3 on time.",
    rec:"Add a delivery-promise buffer in the three worst regions.",
    links:[["GitHub",null],["Write-up",null]] },

  { id:"sales", roles:["analytics"], pin:["analytics"], sample:true, thumb:"sales",
    title:"A sales dashboard a regional VP can read in 30 seconds",
    blurb:"Leads with revenue vs. target, margin, and top-losing product lines. Surfaced a discount pattern eroding margin in one region.",
    skills:["Tableau","KPI design","Dashboards"],
    q:"Which regions and products are missing target, and why?",
    a:"Defined three KPIs with the sales team, then built filters by region and rep.",
    r:"Heavy discounting in one region was cutting margin by about 4 points.",
    rec:"Cap discounts and review that region monthly.",
    links:[["Live dashboard",null],["Write-up",null]] },

  { id:"abtest", roles:["analytics","ml"], pin:["analytics","ml"], sample:true, thumb:"abtest",
    title:"Did the new checkout button actually lift conversions?",
    blurb:"Checked for sample-ratio problems, then ran a two-proportion test. Lift was concentrated on mobile, so I recommended a staged rollout.",
    skills:["Python","Hypothesis testing","A/B testing"],
    q:"Did the new checkout button lift conversion?",
    a:"Cleaned the export, checked the traffic split, then ran a two-proportion test.",
    r:"Conversion rose from 5.2% to 6.1%, mostly on mobile.",
    rec:"Roll out in stages, starting with mobile.",
    links:[["Notebook",null],["GitHub",null]] },

  { id:"churn", roles:["ml"], pin:["ml"], sample:true, thumb:"curve",
    title:"Predicting which customers will cancel, before they do",
    blurb:"Placeholder: replace with your own churn or classification project, including how you validated it.",
    skills:["Python","scikit-learn","Feature engineering","Model evaluation"],
    q:"Which customers are most likely to cancel next month?",
    a:"Built features from usage history, compared a baseline to a tuned model, and validated on a held-out period.",
    r:"[Add your real metric here, for example recall at a fixed precision.]",
    rec:"[Add what the business should do with the predictions.]",
    links:[["GitHub",null],["Notebook",null]] },

  { id:"api", roles:["ml"], pin:["ml"], sample:true, thumb:"api",
    title:"Turning a trained model into a working API",
    blurb:"Placeholder: replace with a project where you deployed a model so someone else can call it.",
    skills:["Python","FastAPI","Docker","Deployment"],
    q:"Can someone use the model without opening a notebook?",
    a:"Wrapped the model in a small API, added input checks, and packaged it in a container.",
    r:"[Add what you shipped, for example latency or a live demo link.]",
    rec:"[Add what you would monitor or improve next.]",
    links:[["Live demo",null],["GitHub",null]] }
];

/* --------------------------- code below needs no edits --------------------------- */
const ROLE_BADGE = {analytics:"Analytics", ml:"ML"};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const fresh = () => ({skills:new Set(), q:""});
const st = {};
TABS.forEach(t => { st[t.id] = fresh(); });
let current = null, carry = null;

P.forEach(p => { p.thumbHTML = THUMBS[p.thumb] || ""; });

const tabProjects = (tab) => tab==="all" ? P : P.filter(p => p.roles.includes(tab));
const pinnedFor = (tab) => P.filter(p => p.roles.includes(tab) && (p.pin||[]).includes(tab)).slice(0,3).map(p => p.id);

function matches(p, s){
  for (const k of s.skills) if (!p.skills.includes(k)) return false;
  const hay = (p.title+" "+p.blurb+" "+p.skills.join(" ")+" "+p.roles.map(r => ROLE_BADGE[r]).join(" ")).toLowerCase();
  return s.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}

function tagsHTML(p, s){
  return '<ul class="tags">'+p.skills.map(k =>
    '<li><button class="sk" data-skill="'+esc(k)+'" aria-pressed="'+s.skills.has(k)+'" title="Filter by '+esc(k)+'">'+esc(k)+'</button></li>').join("")+'</ul>';
}
function detailsHTML(p){
  return '<div class="more"><div class="more-in">'
    + '<p><strong>Question:</strong> '+p.q+'</p><p><strong>Approach:</strong> '+p.a+'</p>'
    + '<p><strong>Result:</strong> '+p.r+'</p><p><strong>Recommendation:</strong> '+p.rec+'</p></div></div>';
}
function linksHTML(p){
  return p.links.map(([l,h]) => h
    ? '<a href="'+h+'" target="_blank" rel="noopener">'+l+'</a>'
    : '<span class="soon">'+l+' (soon)</span>').join("");
}
function badgesHTML(p, showRoles){
  const b = (showRoles ? p.roles.map(r => '<span class="badge">'+ROLE_BADGE[r]+'</span>').join("") : "")
    + (p.sample ? '<span class="badge sample">Sample</span>' : "");
  return b ? '<div class="badges">'+b+'</div>' : "";
}
function cardHTML(p, s){
  return '<article class="card" tabindex="0">'+p.thumbHTML+badgesHTML(p,false)
    + '<h3>'+p.title+'</h3><p>'+p.blurb+'</p>'+tagsHTML(p,s)+detailsHTML(p)
    + '<div class="links">'+linksHTML(p)+'</div></article>';
}
function rowHTML(p, s, showRoles){
  return '<article class="row" tabindex="0"><div class="rthumb" aria-hidden="true">'+p.thumbHTML+'</div>'
    + '<div class="rbody">'+badgesHTML(p,showRoles)+'<h3>'+p.title+'</h3><p class="rblurb">'+p.blurb+'</p>'
    + tagsHTML(p,s)+detailsHTML(p)+'</div><div class="links">'+linksHTML(p)+'</div></article>';
}
function emptyHTML(offerAll){
  return '<div class="empty">No projects match those filters.'
    + (offerAll ? '<button class="clear" data-carry>Search all projects with these filters</button>' : '')
    + '<button class="clear" data-clear-inline>Clear filters</button></div>';
}

function buildPanels(){
  $("#panels").insertAdjacentHTML("beforeend", TABS.map(t => {
    const isAll = t.id==="all";
    const R = ROLES[t.id];
    const skills = isAll ? [...new Set(P.flatMap(p => p.skills))].sort((a,b) => a.localeCompare(b)) : R.skills;
    return '<section role="tabpanel" id="panel-'+t.id+'" aria-labelledby="tab-'+t.id+'" hidden>'
      + '<div class="intro"><h1>'+(isAll ? "All Projects" : R.h1)+'</h1><p class="lede">'+(isAll ? ALL_LEDE : R.lede)+'</p>'
      + '<ul class="skills" id="chips-'+t.id+'" aria-label="Filter by skill">'
      + skills.map(k => '<li><button class="sk" data-skill="'+esc(k)+'" aria-pressed="false">'+esc(k)+'</button></li>').join("")+'</ul>'
      + '<p class="skills-hint">Select skills to filter projects. You can pick more than one.</p></div>'
      + '<div class="controls"><input class="search" id="search-'+t.id+'" type="search" placeholder="Search projects" aria-label="Search projects" autocomplete="off">'
      + '<div class="status"><span id="status-'+t.id+'" aria-live="polite"></span><span class="actives" id="active-'+t.id+'"></span>'
      + '<button class="clear" id="clear-'+t.id+'" hidden>Clear filters</button></div></div>'
      + '<div id="res-'+t.id+'"></div></section>';
  }).join(""));
  TABS.forEach(t => {
    $("#search-"+t.id).addEventListener("input", e => { st[t.id].q = e.target.value; render(t.id); });
  });
}

function buildTabs(){
  $("#tablist").innerHTML = TABS.map(t =>
    '<button role="tab" id="tab-'+t.id+'" aria-controls="panel-'+t.id+'" aria-selected="false" tabindex="-1">'+esc(t.label)
    + (t.id==="all" ? '<span class="count">'+P.length+'</span>' : "")+'</button>').join("");
}

function render(tab){
  const s = st[tab], list = tabProjects(tab), shown = list.filter(p => matches(p,s));
  const filtered = s.skills.size > 0 || s.q.trim() !== "";
  document.querySelectorAll("#chips-"+tab+" [data-skill]").forEach(b =>
    b.setAttribute("aria-pressed", s.skills.has(b.dataset.skill)));
  $("#status-"+tab).textContent = "Showing "+shown.length+" of "+list.length+" projects";
  $("#active-"+tab).innerHTML = [...s.skills].map(k =>
    '<button class="sk x" data-remove="'+esc(k)+'" aria-label="Remove filter '+esc(k)+'">'+esc(k)+' &times;</button>').join("");
  $("#clear-"+tab).hidden = !filtered;
  let html = "";
  if (!shown.length){
    html = emptyHTML(tab !== "all");
  } else if (tab === "all"){
    html = '<div class="rows" style="margin-top:18px">'+shown.map(p => rowHTML(p,s,true)).join("")+'</div>';
  } else {
    const pins = pinnedFor(tab);
    const top = shown.filter(p => pins.includes(p.id));
    const more = shown.filter(p => !pins.includes(p.id));
    if (top.length) html += '<h2 class="sec">Top Projects</h2><div class="grid">'+top.map(p => cardHTML(p,s)).join("")+'</div>';
    if (more.length) html += '<h2 class="sec">More Projects</h2><div class="rows">'+more.map(p => rowHTML(p,s,false)).join("")+'</div>';
    if (top.length) html += '<p class="hint">Hover over a project, or tab to it, for details.</p>';
  }
  $("#res-"+tab).innerHTML = html;
}

function route(){
  const h = location.hash.slice(1);
  const id = TABS.some(t => t.id===h) ? h : "analytics";
  if (id !== current){
    TABS.forEach(t => { st[t.id] = fresh(); $("#search-"+t.id).value = ""; });
    if (carry && id==="all"){ st.all = carry; $("#search-all").value = carry.q; }
    carry = null;
    current = id;
  }
  TABS.forEach(t => {
    const on = t.id===id, tab = $("#tab-"+t.id);
    tab.setAttribute("aria-selected", on);
    tab.tabIndex = on ? 0 : -1;
    $("#panel-"+t.id).hidden = !on;
  });
  document.title = "Chana Shifrin | "+TABS.find(t => t.id===id).label;
  render(id);
}
function go(id){ if (location.hash.slice(1)===id) route(); else location.hash = id; }

document.addEventListener("click", e => {
  const tab = e.target.closest("[role=tab]");
  if (tab){ go(tab.id.replace("tab-","")); return; }
  const s = st[current];
  const sk = e.target.closest("[data-skill]");
  if (sk){
    const k = sk.dataset.skill;
    if (s.skills.has(k)) s.skills.delete(k); else s.skills.add(k);
    const inResults = !!sk.closest("#res-"+current);
    render(current);
    if (inResults){ const nb = $('#res-'+current+' [data-skill="'+k+'"]'); if (nb) nb.focus(); }
    return;
  }
  const rm = e.target.closest("[data-remove]");
  if (rm){ s.skills.delete(rm.dataset.remove); render(current); return; }
  if (e.target.closest("#clear-"+current) || e.target.closest("[data-clear-inline]")){
    st[current] = fresh(); $("#search-"+current).value = ""; render(current); return;
  }
  if (e.target.closest("[data-carry]")){ carry = {skills:new Set(s.skills), q:s.q}; go("all"); }
});

$("#tablist").addEventListener("keydown", e => {
  const ids = TABS.map(t => t.id);
  const cur = ids.indexOf(document.activeElement.id.replace("tab-",""));
  if (cur < 0) return;
  let next = null;
  if (e.key==="ArrowRight") next = (cur+1) % ids.length;
  else if (e.key==="ArrowLeft") next = (cur-1+ids.length) % ids.length;
  else if (e.key==="Home") next = 0;
  else if (e.key==="End") next = ids.length-1;
  if (next===null) return;
  e.preventDefault();
  go(ids[next]);
  $("#tab-"+ids[next]).focus();
});

window.addEventListener("hashchange", route);
buildTabs();
buildPanels();
if (P.some(p => p.sample)) $("#foot").innerHTML = "&copy; 2026 Chana Shifrin. Projects marked Sample are placeholders.";
route();
</script>
